---
- name: Wait for SSH to become available
  ansible.builtin.wait_for_connection:
    timeout: 300
    sleep: 5

- name: Install HAProxy
  apt:
    name: haproxy
    state: present
    update_cache: yes

- name: Configure HAProxy
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: "0644"
  notify: Restart HAProxy

- name: Enable HAProxy
  systemd:
    name: haproxy
    enabled: yes
    state: started
