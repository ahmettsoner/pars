---
- name: Configure systemd-resolved DNS servers
  ansible.builtin.blockinfile:
    path: /etc/systemd/resolved.conf
    block: |
      [Resolve]
      DNS=8.8.8.8 8.8.4.4
      FallbackDNS=1.1.1.1 1.0.0.1
  become: true

- name: Restart systemd-resolved service
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
    enabled: yes
  become: true

- name: Wait for SSH to become available
  ansible.builtin.wait_for_connection:
    timeout: 300
    sleep: 5
- name: Create etcd user
  ansible.builtin.user:
    name: etcd
    system: yes
    shell: /sbin/nologin
  become: true

- name: Create data and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0755"
  loop:
    - "{{ etcd_data_dir }}"
    - "{{ etcd_conf_dir }}"
  become: true

- name: Download etcd archive
  ansible.builtin.get_url:
    url: "{{ etcd_download_url }}"
    dest: "/tmp/etcd-{{ etcd_version }}-linux-amd64.tar.gz"
    mode: "0644"
  become: true

- name: Extract etcd archive
  ansible.builtin.unarchive:
    src: "/tmp/etcd-{{ etcd_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: yes
  become: true

- name: Move etcd binaries to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/etcd-{{ etcd_version }}-linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop:
    - etcd
    - etcdctl
  become: true

- name: Create etcd config file
  ansible.builtin.template:
    src: etcd.conf.j2
    dest: "{{ etcd_conf_dir }}/etcd.conf"
    owner: etcd
    group: etcd
    mode: "0644"
  become: true

- name: Create systemd service file
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: "0644"
  become: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
  become: true

- name: Enable and start etcd service
  ansible.builtin.systemd:
    name: etcd
    state: started
    enabled: yes
  become: true
