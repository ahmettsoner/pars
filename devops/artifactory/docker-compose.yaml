version: "3"

services:
  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:latest
    container_name: artifactory
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - artifactory-data:/var/opt/jfrog/artifactory
    environment:
      - EXTRA_JAVA_OPTIONS=-Xms512m -Xmx2g
    shm_size: "2g"

volumes:
  artifactory-data:
