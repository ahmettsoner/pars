services:
  jenkins:
    image: jenkins/jenkins:latest
    container_name: jenkins-master
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /home/ahmetsoner/AS/prs/pars:/var/prj/pars
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    networks:
      - jenkins_network

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    ports:
      - "3030:3000"
      - "2222:22"
    volumes:
      - gitea_data4:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - APP_NAME=Local Git
      - GITEA__server__PROTOCOL=http
      - GITEA__server__DOMAIN=git.pusula.int
      - GITEA__server__ROOT_URL=http://git.pusula.int
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres_gitea:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=gitea123
      - GITEA__database__SCHEMA=public
      - GITEA__service__DISABLE_REGISTRATION=true
      # - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=your_random_secret
      - GITEA__admin__USER=admin
      - GITEA__admin__PASSWORD=admin123
      - GITEA__admin__EMAIL=admin@local.git
    depends_on:
      - postgres
    networks:
      - jenkins_network

  postgres:
    image: postgres
    container_name: postgres_gitea
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: gitea123
    volumes:
      - postgres_data4:/var/lib/postgresql/data
    networks:
      - jenkins_network

networks:
  jenkins_network:
    driver: bridge

volumes:
  jenkins_home:
  gitea_data4:
  postgres_data4:
