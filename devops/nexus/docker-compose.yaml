services:
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus-main
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./data/nexus:/nexus-data
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms512m -Xmx2048m -XX:MaxDirectMemorySize=2g
    networks:
      - nexus

  nginx:
    image: nginx:latest
    container_name: nexus-nginx
    restart: unless-stopped
    ports:
      - "8070:80"
    volumes:
      - ./data/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nexus

networks:
  nexus:
