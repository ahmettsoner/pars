name: Build-Dev

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ahmetsoner/gh-build-image:latest
      options: --user builder

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Prepare version and tag
        run: |
          git config --global --add safe.directory $(pwd)
          chmod -R a+w .git

          CHANNEL=dev

          BUILD_VERSION=$(vereasy phase dev --next)

          git tag -a $BUILD_VERSION -m "$CHANNEL release $BUILD_VERSION"
          make build.cmake.$BUILD_VERSION

          git checkout dev

          echo "VERSION=$BUILD_VERSION" >> $GITHUB_ENV

      - name: generate release notes
        run: grm changelog

      # - name: build bin"
      #   run: make build.binary.linux.arm64 VERSION=$VERSION
