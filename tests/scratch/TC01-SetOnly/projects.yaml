Type: Project
Kind: Application
Name:  {{ .Name }}
Metadata:
  Tags:
  {{range .Tags}}- {{.}}
  {{end}}
Specifications:
  Name: {{ .Name }}
  Platform: {{ .Platform }}
  ProjectType: {{ .Type }}
  Set: {{ .Set }}


  Layers:
  {{range .Layers}}- {{.}}
  {{end}}
  {{ if gt (len .Dependencies) 0 }}
  Dependencies:
  {{range .Data.Dependencies}}- {{ . }}{{end}}
  {{ end }}
  {{ if gt (len .References) 0 }}
  References:
  {{range .References}}- {{ . }}{{end}}
  {{ end }}
